services:
  db:
    image: fermento-db
    container_name: fermento-db
    build: ./database
    restart: unless-stopped
    environment:
      - POSTGRES_DB=fermento
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - edge-net

  nginx:
    image: nginx:latest
    container_name: fermento-nginx
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - edge-net
    depends_on:
      - frontend
      - api
      - ingestor

  mosquitto:
    image: fermento-mosquitto
    container_name: fermento-mosquitto
    build: ./mosquitto
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    ports:
      - 1883:1883
      - 9001:9001
    networks:
      - edge-net

  grafana:
    image: grafana/grafana:latest
    container_name: fermento-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=gr$590-mMkloqRt_90
      - GF_INSTALL_PLUGINS=volkovlabs-echarts-panel
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - edge-net

  frontend:
    image: fermento-frontend
    container_name: fermento-frontend
    build: ./frontend
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLESTATICSERVING=true
      - STREAMLIT_SERVER_BASEURLPATH=/fermento/v1
    ports:
      - 8501:8501
    networks:
      - edge-net

  api:
    image: fermento-api
    container_name: fermento-api
    build: ./api
    restart: unless-stopped
    environment:
      - API_ROOT_PATH=/src/data/
      - API_DB_URL=${API_DB_URL}
      - API_LOG_LEVEL=DEBUG
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    ports:
      - 8091:8091
    volumes:
      - ./api/data/:/src/data/
      - ./api/src/migrations/versions:/src/migrations/versions/
    networks:
      - edge-net
    depends_on:
      - db

  ingestor:
    image: fermento-ingestor
    container_name: fermento-ingestor
    build: ./ingestor
    restart: unless-stopped
    environment:
      - API_ADDRESS=http://api:8091
      - BROKER_ADDRESS=mosquitto
      - BROKER_PORT=1883
      - TOPIC_FEEDING_SAMPLES_CREATE=fermento/+/feeding_samples/create
      - TOPIC_JARS_CREATE=fermento/+/jars/create
      - TOPIC_FEEDING_EVENTS_REQUEST=fermento/+/feeding_events/request
      - TOPIC_FEEDING_EVENTS_RECEIVE=fermento/feeding_events/receive
    ports:
      - 8092:8092
    volumes:
      - ./ingestor/data/:/src/data/
      - ./ingestor/src/migrations/versions:/src/migrations/versions/
    networks:
      - edge-net
    depends_on:
      - mosquitto
      - api

  processor:
    image: fermento-processor
    container_name: fermento-processor
    build: ./processor
    restart: unless-stopped
    environment:
      - API_ADDRESS=http://api:8091
      - BROKER_ADDRESS=mosquitto
      - BROKER_PORT=1883
    networks:
      - edge-net
    depends_on:
      - mosquitto

volumes:
  timescale_data:
  mosquitto-data:
  mosquitto-log:
  grafana_data:


networks:
  edge-net:
    external: true
